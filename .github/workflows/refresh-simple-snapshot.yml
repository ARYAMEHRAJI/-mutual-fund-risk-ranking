name: Refresh simple mutual fund data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-simple-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: دریافت کدهای پروژه
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: هماهنگ شدن با آخرین نسخه مخزن
        run: |
          git fetch origin group-relative-ranking
          git reset --hard origin/group-relative-ranking

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب کتابخانه‌های لازم
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-simple.txt

      - name: بررسی ساده بودن و سلامت کدها
        run: |
          python -m py_compile daily_update.py simple_data.py simple_metrics.py simple_ranking.py simple_database.py simple_app.py

      - name: دریافت و محاسبه اطلاعات همه صندوق‌ها
        run: python daily_update.py

      - name: ذخیره امن فایل به‌روزشده در گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json
          if git diff --cached --quiet; then
            echo "داده جدیدی برای ذخیره وجود ندارد."
          else
            git commit -m "data: refresh all mutual fund alpha and beta"
            git fetch origin group-relative-ranking
            git rebase origin/group-relative-ranking
            git push origin HEAD:group-relative-ranking
          fi
