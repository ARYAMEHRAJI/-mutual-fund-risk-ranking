name: Run simple project live test

# این گردش کار با هر تغییر در نسخه ساده یا با اجرای دستی شروع می شود.

on:
  workflow_dispatch:
  push:
    branches: [simple-version]
    paths:
      - "simple_*.py"
      - "requirements-simple.txt"
      - ".github/workflows/test-simple-version.yml"

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-simple.txt

      - name: Check Python files
        run: python -m py_compile simple_data.py simple_metrics.py simple_ranking.py simple_app.py

      - name: Run a live data and ranking test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from simple_data import دریافت_صندوق_ها, انتخاب_صندوق_ها, دریافت_nav
          from simple_metrics import محاسبه_شاخص_ها, دریافت_آلفا_بتا_از_سرویس
          from simple_ranking import رتبه_بندی

          print("1) دریافت فهرست صندوق ها...")
          همه = دریافت_صندوق_ها()
          if همه.empty:
              raise RuntimeError("فهرست صندوق ها خالی است.")
          print("تعداد کل صندوق های دریافتی:", همه["scheme_code"].nunique())

          print("2) انتخاب صندوق های Large Cap...")
          انتخابی = انتخاب_صندوق_ها(همه, "Large Cap").head(5)
          if انتخابی.empty:
              raise RuntimeError("هیچ صندوق Large Cap واجد شرایطی پیدا نشد.")
          print("تعداد صندوق های انتخاب شده:", len(انتخابی))

          print("3) دریافت NAV...")
          nav = دریافت_nav(انتخابی["scheme_code"].tolist())
          if nav.empty:
              raise RuntimeError("داده NAV خالی است.")
          print("تعداد صندوق های دارای NAV:", nav["scheme_code"].nunique())

          print("4) محاسبه بازدهی و ریسک...")
          metrics = محاسبه_شاخص_ها(nav)
          if metrics.empty:
              raise RuntimeError("شاخص های صندوق محاسبه نشدند.")

          print("5) دریافت آلفا و بتا از Charlie Alpha API...")
          alpha_beta = دریافت_آلفا_بتا_از_سرویس(
              metrics["scheme_code"].astype(str).tolist(),
              افق="3Y"
          )
          result = metrics.copy()
          result["scheme_code"] = result["scheme_code"].astype(str)
          alpha_beta["scheme_code"] = alpha_beta["scheme_code"].astype(str)
          result = result.merge(alpha_beta, on="scheme_code", how="left")
          تعداد_آلفا = int(result["alpha"].notna().sum())
          تعداد_بتا = int(result["beta"].notna().sum())
          print("صندوق های دارای آلفا:", تعداد_آلفا)
          print("صندوق های دارای بتا:", تعداد_بتا)
          if تعداد_آلفا == 0 or تعداد_بتا == 0:
              raise RuntimeError("API آلفا و بتا برای هیچ کدام از صندوق های آزمون داده برنگرداند.")

          print("6) رتبه بندی چهار پروفایل...")
          ranked = رتبه_بندی(result)
          if ranked.empty:
              raise RuntimeError("جدول رتبه بندی خالی است.")
          required = ["Conservative_rank", "Moderate_rank", "Growth_rank", "Aggressive_rank"]
          missing = [column for column in required if column not in ranked.columns]
          if missing:
              raise RuntimeError("ستون های رتبه بندی وجود ندارند: " + str(missing))

          print("آزمون موفق بود. نمونه خروجی:")
          print(ranked[["scheme_name", "return_1y", "volatility", "max_drawdown",
                        "alpha", "beta", "Conservative_rank", "Moderate_rank",
                        "Growth_rank", "Aggressive_rank"]].to_string(index=False))
          PY
