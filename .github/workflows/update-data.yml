name: Refresh mutual fund rankings
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1-5"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pyarrow
      - name: Run data pipeline
        env:
          TIGZIG_REQUEST_DELAY: "21"
        run: python scripts/run_pipeline.py
      - name: Store refreshed datasets as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mutual-fund-rankings
          path: data/processed/
          retention-days: 14
      - name: Commit dated full-universe metadata snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata_snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "data: archive scheme metadata snapshot"
            git push
          else
            echo "No new metadata snapshot to commit."
          fi
