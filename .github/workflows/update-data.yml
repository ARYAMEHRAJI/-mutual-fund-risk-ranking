name: Refresh mutual fund rankings
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1-5"
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/expanded-risk-benchmark-metrics]
    paths-ignore:
      - "metadata_snapshots/**"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pyarrow pytest
      - name: Run project tests
        run: python -m pytest
      - name: Validate static dashboard JavaScript
        run: node --check site/app.js
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pyarrow pytest
      - name: Run project tests
        run: python -m pytest
      - name: Validate static dashboard JavaScript
        run: node --check site/app.js
      - name: Run data pipeline
        env:
          TIGZIG_REQUEST_DELAY: "21"
        run: python scripts/run_pipeline.py
      - name: Export data for static web dashboard
        run: python scripts/export_static_dashboard.py
      - name: Store refreshed datasets as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mutual-fund-rankings
          path: data/processed/
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Publish static dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Store metadata snapshot as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheme-metadata-snapshot
          path: metadata_snapshots/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit dated full-universe metadata snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d metadata_snapshots ]; then
            git add metadata_snapshots/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: archive scheme metadata snapshot"
            git push
          else
            echo "No new metadata snapshot to commit."
          fi
