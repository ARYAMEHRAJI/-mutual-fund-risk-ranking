name: Daily mutual fund data refresh

on:
  schedule:
    # 03:30 India Standard Time (22:00 UTC)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fund-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          ref: group-relative-ranking
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check Python syntax
        run: python -m py_compile simple_app.py daily_update.py simple_data.py simple_metrics.py simple_ranking.py simple_database.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check category detection and AUM ranking
        run: |
          python - <<'PY'
          import pandas as pd
          from simple_data import پیدا_کردن_گروه
          from simple_ranking import رتبه_بندی, انتخاب_صندوق_های_متنوع
          from simple_metrics import تبدیل_پاسخ_آلفا_بتا

          assert پیدا_کردن_گروه("Sectoral Fund") == "Equity - Sectoral"
          assert پیدا_کردن_گروه("Thematic Fund") == "Equity - Thematic"
          assert پیدا_کردن_گروه("Index Funds/ETFs") == "Other - Index"
          assert پیدا_کردن_گروه("Gold ETF") == "Other - Gold"
          assert پیدا_کردن_گروه("Silver ETF") == "Other - Silver"

          sample = pd.DataFrame({
              "scheme_code": ["101", "102"],
              "fund_group": ["Equity - Sectoral", "Equity - Sectoral"],
              "return_1w": [0.01, 0.02],
              "return_1m": [0.02, 0.03],
              "return_3m": [0.04, 0.06],
              "return_6m": [0.07, 0.09],
              "return_1y": [0.10, 0.15],
              "return_3y": [0.30, 0.40],
              "volatility": [0.20, 0.15],
              "max_drawdown": [-0.25, -0.18],
              "sharpe": [0.50, 0.80],
              "sortino": [0.60, 0.90],
              "aum_cr": [100.0, 200.0],
          })
          ranked = رتبه_بندی(sample)
          assert "size_score" in ranked.columns
          assert ranked["size_score"].notna().all()
          assert ranked["Moderate_score"].notna().all()

          # در انتخاب پنج‌تایی، تا حد امکان حداکثر دو گزینه از هر گروه می‌آید.
          diverse_sample = pd.DataFrame({
              "scheme_code": ["1", "2", "3", "4", "5", "6"],
              "fund_group": ["A", "A", "A", "B", "C", "D"],
              "Growth_score": [99, 98, 97, 96, 95, 94],
          })
          selected = انتخاب_صندوق_های_متنوع(diverse_sample, "Growth_score", 5, 2)
          assert len(selected) == 5
          assert selected["fund_group"].value_counts().max() <= 2

          # ساختار واقعی پاسخ مستند Charlie API و تبدیل واحد آلفا.
          alpha_beta = تبدیل_پاسخ_آلفا_بتا({
              "benchmark": "TEST TRI",
              "data_as_of": "2026-11-20",
              "metrics": {"3Y": {"alpha": 1.25, "beta": 0.95}},
              "sample_counts": {"metrics": {"3Y": {"alpha": 100}}}
          }, "123456", "3Y")
          assert abs(alpha_beta["alpha"] - 0.0125) < 1e-9
          assert alpha_beta["beta"] == 0.95
          assert alpha_beta["alpha_beta_error"] == ""

          print("Category, AUM, diversification and Alpha/Beta checks passed.")
          PY

      - name: Download data and calculate rankings
        run: python daily_update.py

      - name: Save latest snapshot to project branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily mutual fund data"
            git push origin HEAD:group-relative-ranking
          fi
