[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutual-fund-risk-ranking"
version = "0.1.0"
description = "Risk-return analysis and investor-profile-based mutual fund ranking"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3.0", "numpy>=1.26,<3.0", "requests>=2.31,<3.0", "python-dotenv>=1.0,<2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
